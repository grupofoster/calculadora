<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Cuotas - Grupo Foster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 640px;
      margin: auto;
      padding: 20px;
      background: #ebebeb;
      min-height: 100vh;
    }

    h2 {
      text-align: center;
      color: #2c2c2c;
      margin-bottom: 6px;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.10);
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: 1.5px solid #d0d0d0;
      border-radius: 7px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #E8620A;
    }

    button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-calcular {
      background: #E8620A;
      color: white;
    }

    .btn-whatsapp {
      background: #ff7a00;
      color: white;
      display: none;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      background: #f4f4f4;
      border-left: 4px solid #E8620A;
      border-radius: 8px;
    }

    .note {
      font-size: 13px;
      color: gray;
      margin-top: 10px;
      line-height: 1.5;
    }

    img.logo {
      width: 140px;
      display: block;
      margin: 0 auto 10px auto;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <img src="logo.png" class="logo" alt="Grupo Foster">

  <h2>Calculadora de Cuotas - Grupo Foster C.A</h2>

  <div class="box">

    <input type="number" id="monto" placeholder="Monto Total del Presupuesto (USD$)">

    <select id="frecuencia">
      <option value="">¿Cuál frecuencia de pago prefieres?</option>
      <option value="semanal">Semanal</option>
      <option value="quincenal">Quincenal</option>
    </select>

    <button class="btn-calcular" onclick="calcular()">Calcular</button>

    <div class="result" id="resultado"></div>

    <button class="btn-whatsapp" id="whatsappBtn" onclick="enviarWhatsApp()">
      Agendar mi Remodelación
    </button>

    <div class="note">
      ⚠️ Importante: Al llegar al 50% del pago total iniciamos la ejecución de la obra según cronograma.
    </div>

  </div>

<script>
function calcular() {

  let monto = parseFloat(document.getElementById("monto").value);
  let frecuencia = document.getElementById("frecuencia").value;

  if (!monto || monto < 400 || monto > 1400) {
    document.getElementById("resultado").innerHTML = "Ingresa un monto entre $400 y $1400";
    return;
  }

  if (!frecuencia) {
    document.getElementById("resultado").innerHTML = "Selecciona la frecuencia de pago";
    return;
  }

  let inicial = monto * 0.25;
  let restante = monto * 0.75;

  let cuotas = 0;

  if (monto <= 600) {
    cuotas = (frecuencia === "semanal") ? 3 : 2;
  } else if (monto <= 1000) {
    cuotas = (frecuencia === "semanal") ? 5 : 3;
  } else {
    cuotas = (frecuencia === "semanal") ? 8 : 4;
  }

  let valorCuota = restante / cuotas;

  let semanasTotal = 0;
  let semanasInicioObra = 0;

  if (frecuencia === "semanal") {
    semanasTotal = cuotas;
    semanasInicioObra = Math.ceil(cuotas / 2);
  } else {
    semanasTotal = cuotas * 2;
    semanasInicioObra = Math.ceil(semanasTotal / 2);
  }

  document.getElementById("resultado").innerHTML = `
    <b>Pago Inicial (25%):</b> $${inicial.toFixed(2)}<br>
    <b>Monto Restante:</b> $${restante.toFixed(2)} (75%)<br>
    <b>Número de cuotas:</b> ${cuotas}<br>
    <b>Valor por cuota:</b> $${valorCuota.toFixed(2)}<br>
    <b>Inicio de obra (50%):</b> Semana ${semanasInicioObra}<br>
    <b>Tiempo total de pago:</b> ${semanasTotal} semanas
  `;

  document.getElementById("whatsappBtn").style.display = "block";

  window.resultadoFinal =
`Hola Grupo Foster 👋%0A%0A` +
`Quiero agendar mi remodelación en cuotas.%0A%0A` +
`📌 Resumen:%0A` +
`Monto total: $${monto}%0A` +
`Frecuencia: ${frecuencia}%0A` +
`Pago inicial (25%): $${inicial.toFixed(2)}%0A` +
`Restante (75%): $${restante.toFixed(2)}%0A` +
`Cuotas: ${cuotas}%0A` +
`Valor cuota: $${valorCuota.toFixed(2)}%0A` +
`Inicio de obra: Semana ${semanasInicioObra}%0A` +
`Duración total: ${semanasTotal} semanas%0A%0A` +
`Quiero iniciar mi proyecto.`;
}

function enviarWhatsApp() {
  let numero = "584245848308";
  window.open(`https://wa.me/${numero}?text=${window.resultadoFinal}`, "_blank");
}
</script>

</body>
</html>
